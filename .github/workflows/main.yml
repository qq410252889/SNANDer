# Workflow's name
name: Build Application for Windows

# Required permissions for the automatic GITHUB_TOKEN (publish release assets)
permissions:
  contents: write

# Workflow's trigger
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 1.7.9.3 or 1.7.9.3-ch347)'
        required: false
        default: '1.7.9.3'
      branch:
        description: 'Branch to build (master or ch347)'
        required: false
        default: 'master'
      variant:
        description: 'Variant label (CH341A or CH347)'
        required: false
        default: 'CH341A'

# Workflow's jobs
jobs:
  # job's id
  publish:
    # job's name
    name: Build and Publish Release
    # the type of machine to run the job on (pin LTS; ubuntu-latest migrated to Ubuntu 26 on 2026-10-19)
    runs-on: ubuntu-24.04

    if: github.event.repository.owner.id == github.event.sender.id

    # create steps
    steps:
      # step0: Resolve branch / variant / zip name from tag
      #   tag v.1.7.9.3       -> master branch (CH341A), zip SNANDer_V1.7.9.3.zip
      #   tag v.1.7.9.3-ch347 -> ch347 branch (CH347), zip SNANDer-CH347_V1.7.9.3.zip
      #   manual dispatch    -> master branch (CH341A), SNANDer_V<tag>.zip if tag provided
      - name: Resolve Branch and Package Name
        id: info
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            BRANCH="${{ github.event.inputs.branch }}"
            VARIANT="${{ github.event.inputs.variant }}"
            echo "branch=${BRANCH:-master}" >> "$GITHUB_OUTPUT"
            echo "variant=${VARIANT:-CH341A}" >> "$GITHUB_OUTPUT"
            if [[ "${VARIANT:-CH341A}" == "CH347" ]]; then
              echo "zip=SNANDer-CH347_V${TAG:-latest}.zip" >> "$GITHUB_OUTPUT"
            else
              echo "zip=SNANDer-CH341_V${TAG:-latest}.zip" >> "$GITHUB_OUTPUT"
            fi
            echo "ver=${TAG:-latest}" >> "$GITHUB_OUTPUT"
            echo "release_tag=v.${TAG:-latest}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v.}"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${VER}" == *-ch347 ]]; then
            echo "branch=ch347" >> "$GITHUB_OUTPUT"
            echo "variant=CH347" >> "$GITHUB_OUTPUT"
            echo "zip=SNANDer-CH347_V${VER%-ch347}.zip" >> "$GITHUB_OUTPUT"
          else
            echo "branch=master" >> "$GITHUB_OUTPUT"
            echo "variant=CH341A" >> "$GITHUB_OUTPUT"
            echo "zip=SNANDer-CH341_V${VER}.zip" >> "$GITHUB_OUTPUT"
          fi

      # step1: Check out Git Repository
      - name: Check out Git Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.info.outputs.branch }}

      # step2: Prepare Compilation Environment
      - name: Prepare Compilation Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y pkg-config mingw-w64 tar wget make zip

      # step3: Build App (official cross-compile script for both architectures)
      - name: Build App
        run: |
          ./build-for-windows.sh
          echo "=== build artifacts ==="
          ls -la build/x86/ build/x64/ 2>/dev/null || true
          find . -name "*.exe" -not -path "./.git/*" 2>/dev/null | head -5 || true

      # step4: Prepare Artifacts and Source Package
      - name: Prepare Artifacts and Source Package
        shell: bash
        run: |
          set -e
          cd "${{ github.workspace }}"
          pwd
          ls -la build/x86/ build/x64/
          cp -v build/x86/snander.exe SNANDer-Windows-32bit.exe
          cp -v build/x64/snander.exe SNANDer-Windows-64bit.exe
          mkdir -p release_pkg
          cp SNANDer-Windows-32bit.exe SNANDer-Windows-64bit.exe release_pkg/
          git archive HEAD | tar -x -C release_pkg
          VER="${{ steps.info.outputs.ver }}"
          VARIANT="${{ steps.info.outputs.variant }}"
          {
            echo "SNANDer v${VER} (${VARIANT} 版) - SPI NOR / SPI NAND / EEPROM 编程器工具"
            echo ""
            echo "源码来源（合并版）："
            echo "  - Droid-MAX/SNANDer (${VARIANT} 分支)"
            echo "  - McMCCRU/SNANDer (upstream/main)"
            echo ""
            echo "包含："
            echo "  SNANDer-Windows-32bit.exe  32 位 Windows 可执行文件 (x86)"
            echo "  SNANDer-Windows-64bit.exe  64 位 Windows 可执行文件 (x64)"
            echo "  src/ 及其他文件             完整源码与文档"
            echo ""
            echo "构建信息："
            echo "  GitHub Actions (ubuntu-latest) + mingw-w64 交叉编译"
            echo "  libusb-1.0.27 静态链接，无需额外 DLL"
            echo ""
            echo "使用方法："
            echo "  SNANDer-Windows-64bit.exe -i         读取芯片 ID"
            echo "  SNANDer-Windows-64bit.exe -L         列出支持的芯片"
            echo "  SNANDer-Windows-64bit.exe -E 24c2048 -r dump.bin  读取 I2C EEPROM"
            echo "  （${VARIANT} 版需先安装对应编程器驱动，详情见源码内文档）"
          } > release_pkg/说明.txt
          cd release_pkg && zip -qr "../${{ steps.info.outputs.zip }}" .
          cd ..
          ls -la SNANDer-Windows-32bit.exe SNANDer-Windows-64bit.exe "${{ steps.info.outputs.zip }}"
          echo "Package ready: ${{ steps.info.outputs.zip }}"

      # step5: Publish Release (GitHub CLI)
      - name: Publish Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.info.outputs.release_tag }}"
          ZIP="${{ steps.info.outputs.zip }}"
          VER="${{ steps.info.outputs.ver }}"
          VARIANT="${{ steps.info.outputs.variant }}"
          if [[ "${VARIANT}" == "CH347" ]]; then
            REL_TITLE="SNANDer v${VER}-ch347"
          else
            REL_TITLE="SNANDer v${VER}-ch341"
          fi
          # remove any stale zip assets on this tag (zip naming changed over releases)
          for aid in $(gh api --paginate "/repos/${{ github.repository }}/releases/tags/${TAG}/assets" -q '.[] | select(.name | endswith(".zip")) | .id' 2>/dev/null || true); do
            gh api -X DELETE "/repos/${{ github.repository }}/releases/assets/${aid}" >/dev/null 2>&1 || true
          done
          # create release (skip if it already exists)
          gh release create "${TAG}" SNANDer-Windows-32bit.exe SNANDer-Windows-64bit.exe "${ZIP}" \
            --repo "${{ github.repository }}" \
            --title "${REL_TITLE}" \
            --notes "SNANDer v${VER} (${VARIANT} 版) 云编译发布。\n包含 32/64 位 Windows 可执行文件与完整源码包。\n构建：GitHub Actions + mingw-w64；libusb 静态链接，无需额外 DLL。" 2>&1 \
            || gh release upload "${TAG}" SNANDer-Windows-32bit.exe SNANDer-Windows-64bit.exe "${ZIP}" \
               --repo "${{ github.repository }}" --clobber 2>&1
