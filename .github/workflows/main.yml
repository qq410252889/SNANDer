# Workflow's name
name: Build Application for Windows

# Workflow's trigger
on:
  push:
    tags:
      - '*'

# Workflow's jobs
jobs:
  # job's id
  publish:
    # job's name
    name: Build and Publish Release
    # the type of machine to run the job on
    runs-on: ubuntu-latest

    if: github.event.repository.owner.id == github.event.sender.id

    # create steps
    steps:
      # step0: Resolve branch / variant / zip name from tag
      #   tag v.1.7.9.3       -> master branch (CH341A), zip SNANDer_V1.7.9.3.zip
      #   tag v.1.7.9.3-ch347 -> ch347 branch (CH347), zip SNANDer-CH347_V1.7.9.3.zip
      - name: Resolve Branch and Package Name
        id: info
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v.}"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          if [[ "${VER}" == *-ch347 ]]; then
            echo "branch=ch347" >> "$GITHUB_OUTPUT"
            echo "variant=CH347" >> "$GITHUB_OUTPUT"
            echo "zip=SNANDer-CH347_V${VER%-ch347}.zip" >> "$GITHUB_OUTPUT"
          else
            echo "branch=master" >> "$GITHUB_OUTPUT"
            echo "variant=CH341A" >> "$GITHUB_OUTPUT"
            echo "zip=SNANDer_V${VER}.zip" >> "$GITHUB_OUTPUT"
          fi

      # step1: Check out Git Repository
      - name: Check out Git Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.info.outputs.branch }}

      # step2: Prepare Compilation Environment
      - name: Prepare Compilation Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y pkg-config mingw-w64 tar wget make zip

      # step3: Build App (official cross-compile script for both architectures)
      - name: Build App
        run: |
          ./build-for-windows.sh

      # step4: Prepare Artifacts and Source Package
      - name: Prepare Artifacts and Source Package
        shell: bash
        run: |
          set -e
          cp build/x86/snander.exe SNANDER-Windows-32bit.exe
          cp build/x64/snander.exe SNANDER-Windows-64bit.exe
          mkdir -p release_pkg
          cp SNANDER-Windows-32bit.exe SNANDER-Windows-64bit.exe release_pkg/
          git archive HEAD | tar -x -C release_pkg
          VER="${{ steps.info.outputs.ver }}"
          VARIANT="${{ steps.info.outputs.variant }}"
          cat > release_pkg/说明.txt <<EOF
SNANDer v${VER} (${VARIANT} 版) - SPI NOR / SPI NAND / EEPROM 编程器工具

源码来源（合并版）：
  - Droid-MAX/SNANDer (${VARIANT} 分支)
  - McMCCRU/SNANDer (upstream/main)

包含：
  SNANDer-Windows-32bit.exe  32 位 Windows 可执行文件 (x86)
  SNANDer-Windows-64bit.exe  64 位 Windows 可执行文件 (x64)
  src/ 及其他文件             完整源码与文档

构建信息：
  GitHub Actions (ubuntu-latest) + mingw-w64 交叉编译
  libusb-1.0.27 静态链接，无需额外 DLL

使用方法：
  SNANDer-Windows-64bit.exe -i         读取芯片 ID
  SNANDer-Windows-64bit.exe -L         列出支持的芯片
  SNANDer-Windows-64bit.exe -E 24c2048 -r dump.bin  读取 I2C EEPROM
  （${VARIANT} 版需先安装对应编程器驱动，详情见源码内文档）
EOF
          cd release_pkg && zip -qr "../${{ steps.info.outputs.zip }}" .
          cd ..
          echo "Package ready: ${{ steps.info.outputs.zip }}"

      # step5: Publish Release
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            SNANDer-Windows-32bit.exe
            SNANDer-Windows-64bit.exe
            ${{ steps.info.outputs.zip }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
